name: Quality and dependency checks

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project dependencies and audit tool
        run: python -m pip install --upgrade pip beautifulsoup4 httpx playwright python-dotenv pip-audit
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit installed dependencies
        run: pip-audit
